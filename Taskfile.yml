version: '3'

tasks:
  setup:
    silent: true
    cmds:
      - cargo install cargo-nextest
      - cargo install cargo-watch

  build:
    silent: true
    cmds:
      - task: build:default

  build:default:
    silent: true
    cmds:
      - cargo build

  build:release:
    silent: true
    cmds:
      - cargo build --release

  test:
    silent: true
    cmds:
      - task: test:default

  test:default:
    silent: true
    cmds:
      - cargo nextest run
      - cargo nextest run --package derust --features sdui_stac_1
      - cargo nextest run --package derust --no-default-features --features cryptox
      - cargo nextest run --package derust --features cryptox
      - cargo nextest run --package derust --features cryptox,aws
      - cargo nextest run --package derust --all-features

  test:watch:
    silent: true
    cmds:
      - cargo watch -x "nextest run"

  lint:
    silent: true
    cmds:
      - task: lint:default

  lint:default:
    silent: true
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy -- -D warnings
      - cargo clippy --all-targets --package derust --no-default-features --features cryptox -- -D warnings
      - cargo clippy --all-targets --package derust --features cryptox -- -D warnings
      - cargo clippy --all-targets --package derust --no-default-features --features cryptox,http_server -- -D warnings
      - cargo clippy --all-targets --package derust --features cryptox,aws -- -D warnings

  lint:fix:
    silent: true
    cmds:
      - cargo fmt --all
      - cargo clippy