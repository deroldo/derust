[workspace]

[package]
name = "derust-sqs-idempotency"
version = "0.1.0"
edition = "2021"

[dependencies]
derust = { path = "../../crates/derust", features = ["sqs", "postgres"] }

tokio = { version = "1.45.1", features = ["full"] }
axum = { version = "0.8.4" }
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.9.0" }
wg = { version = "0.9.2" }
